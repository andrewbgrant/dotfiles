bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

set -sg escape-time 0
set -g default-terminal "tmux-256color"
set -sa terminal-features ',xterm-256color:RGB'
set -g focus-events on

set-option -g renumber-windows on
set -g base-index 1
set -g pane-base-index 1

set -g window-status-current-format '#{window_index} #{window_name}*'
set -g window-status-format '#{window_index} #{window_name}'
set -g status-interval 15
set -g status-fg '#909094'
set -g status-bg black

# Enhanced status bar (minimal but useful)
set -g status-left-length 20
set -g status-left '#[fg=#a9b1d6]#{session_name} │ '
set -g status-right '#[fg=#909094]%H:%M '
set -g status-justify left

set -g mouse on

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @continuum-restore 'on' # enable automatic restore
set -g @continuum-save-interval '60' # minutes

is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l


# Create new session quickly
bind-key N command-prompt -p "New session name:" "new-session -d -s '%%'"

# Open new windows in current directory
bind-key c new-window -c "#{pane_current_path}"

run '~/.tmux/plugins/tpm/tpm'
